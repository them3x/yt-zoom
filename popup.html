<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 12px 16px;
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1f1f1f;
    color: #eee;
    width: 180px;
  }
  label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    margin-bottom: 10px;
  }
  label:last-of-type {
    margin-bottom: 0;
  }
  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <label>
    <input type="checkbox" id="minimap-toggle">
    Allow minimap
  </label>
  <label>
    <input type="checkbox" id="zoom-toggle">
    Stop zoom
  </label>
  <script src="popup.js"></script>
</body>
</html>
